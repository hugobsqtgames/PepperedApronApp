appId: ${APP_ID}
---
# No account: a fresh install shows the welcome slides, asks the first name, then opens the app.
- launchApp:
    clearState: true
    clearKeychain: true
- tapOn:
    id: onboarding-skip
- tapOn:
    id: onboarding-start
- tapOn:
    id: onboarding-name
- inputText: Camille
- tapOn:
    id: onboarding-name-submit
- assertVisible:
    id: home-empty
- assertVisible: '.*Camille.*'
