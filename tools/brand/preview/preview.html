    <script>
      'use strict';
      // ================================================================ setup
      const Q = new URLSearchParams(location.search);
      const MODE = Q.get('mode') === 'store' || Q.has('still') ? 'store' : 'marketing';
      // English version (?lang=en): texts translated from en.js.
      const LANG = Q.get('lang') === 'en' ? 'en' : 'fr';
      document.documentElement.lang = LANG;
      const tr = (s) => (LANG === 'en' ? (window.EN[s] ?? s) : s);
      function translateTree(root) {
        if (LANG !== 'en') return;
        const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
        for (let n = w.nextNode(); n; n = w.nextNode()) {
          const k = n.nodeValue.trim();
          if (k && window.EN[k]) n.nodeValue = n.nodeValue.replace(k, window.EN[k]);
        }
      }
      document.body.classList.add(MODE);
      const IPAD = Q.has('ipad');
      if (IPAD) document.body.classList.add('ipad');
      const SW = IPAD ? 1032 : 443;
      const SH = IPAD ? 1376 : 960;
      const PH = '../../../apps/mobile/assets/photos/';
      const ICON = '../../../apps/mobile/assets/icon.png';
      const $ = (s) => document.querySelector(s);
      const stage = $('#stage');
      function fit() {
        const k = Math.min(innerWidth / SW, innerHeight / SH);
        stage.style.transform = `translate(${(innerWidth - SW * k) / 2}px,${(innerHeight - SH * k) / 2}px) scale(${k})`;
      }
      fit();
      addEventListener('resize', fit);

      // ================================================================ easing / timeline helpers
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const lin = (t, a, b) => clamp((t - a) / (b - a));
      const ease = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2); // in-out cubic
      const out = (x) => 1 - Math.pow(1 - x, 4); // out quart
      const expo = (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x));
      const back = (x) => {
        const c = 1.35;
        return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2);
      };
      const mix = (a, b, p) => a + (b - a) * p;
      /** Piecewise interpolation of numeric keyframes [{t, ...values}] with in-out easing. */
      function keys(list, t) {
        if (t <= list[0].t) return list[0];
        for (let i = 0; i < list.length - 1; i++) {
          const A = list[i],
            B = list[i + 1];
          if (t <= B.t) {
            const p = ease(lin(t, A.t, B.t));
            const o = {};
            for (const k in A) o[k] = k === 't' ? t : mix(A[k], B[k] ?? A[k], p);
            return o;
          }
        }
        return list[list.length - 1];
      }
      const css = (el, o) => {
        for (const k in o) el.style[k] = o[k];
      };

      // ================================================================ icons (Ionicons-like, as in the app)
      const I = {
        heart: (c = 'currentColor', f = 'none') =>
          `<svg width="22" height="22" viewBox="0 0 24 24" fill="${f}" stroke="${c}" stroke-width="1.8" stroke-linejoin="round"><path d="M12 20.3s-7.5-4.6-8.8-9.4C2.4 7.9 4.4 5 7.5 5c1.9 0 3.4 1.1 4.5 2.7C13.1 6.1 14.6 5 16.5 5c3.1 0 5.1 2.9 4.3 5.9-1.3 4.8-8.8 9.4-8.8 9.4z"/></svg>`,
        cal: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>`,
        cart: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.2l2.3 11h10.8l2.2-8H6.3"/><circle cx="9.5" cy="19.5" r="1.4"/><circle cx="17" cy="19.5" r="1.4"/></svg>`,
        share: `<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8"/><path d="M8 11H6.5A1.5 1.5 0 0 0 5 12.5v7A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5v-7a1.5 1.5 0 0 0-1.5-1.5H16"/></svg>`,
        more: `<svg width="22" height="22" viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.7" fill="currentColor"/><circle cx="12" cy="12" r="1.7" fill="currentColor"/><circle cx="18" cy="12" r="1.7" fill="currentColor"/></svg>`,

          $('#rem').textContent = `${13 - done} items left`;
          $('#budget').textContent = done
            ? `≈ $42.80 · $${cart.replace(',', '.')} in the basket`
            : '≈ $42.80';
        } else {
          $('#rem').textContent = `${13 - done} articles restants`;
          $('#budget').textContent = done ? `≈ 42,80 € · ${cart} € dans le panier` : '≈ 42,80 €';
        }

        // cook mode: launch the timer, it counts down
        const ckIn = ease(lin(t, 20.5, 21.0));
        const ckOut = ease(lin(t, 24.4, 24.9));
        show('cook', ckIn * (1 - ckOut));
        layers.cook.style.transform = `scale(${screen.clientWidth / 390}) translateY(${(1 - ckIn) * 60}px)`;
        const launched = lin(t, 21.9, 22.2);
        const chip = out(launched);
        css($('#tchip'), { opacity: String(chip), transform: `translateY(${(1 - chip) * 20}px)` });
        const left = Math.max(0, 480 - Math.max(0, t - 22.0) * 7); // accelerated countdown
        $('#tclock').textContent =
          `${String(Math.floor(left / 60)).padStart(2, '0')}:${String(Math.floor(left % 60)).padStart(2, '0')}`;
        $('#launch').style.transform =
          `scale(${1 - 0.05 * (lin(t, 21.8, 21.9) - lin(t, 21.95, 22.1))})`;
        tapped = tapAt(t, 21.75, sp(100), sp(420)) || tapped;
        if (!tapped) tap.style.opacity = '0';

        // ---- captions + outro
        captions(t);
        const o = out(lin(t, 25.0, 26.0));
        const outro = $('#outro');
        outro.style.opacity = String(o);
        outro.querySelector('.icon').style.transform =
          `scale(${0.7 + 0.3 * back(lin(t, 25.0, 25.8))})`;
        [...outro.children].forEach((el, i) => {
          if (i === 0) return;
          const p = out(lin(t, 25.3 + i * 0.18, 25.9 + i * 0.18));
          css(el, { opacity: String(p), transform: `translateY(${(1 - p) * 16}px)` });
        });
      }

      // ================================================================ stills (App Store screenshots)
      // Same composition, one screen at rest under the listing caption (docs/store/listings.json).
      const STILLS = [
        { cap: ['Toutes vos recettes,', '*enfin au même endroit*'], show: 'home' },
        { cap: ['Partagez depuis Instagram :', '*c’est enregistré*'], show: 'reel', at: 5.0 },
        { cap: ['La semaine planifiée', 'en *deux minutes*'], show: 'planning', at: 16.2 },
        { cap: ['La liste de courses', 'se remplit *toute seule*'], show: 'shopping', at: 20.0 },
        { cap: ['« Poulet rapide » :', '*trouvé.*'], show: 'search' },
        { cap: ['En cuisine,', 'minuteurs *compris*'], show: 'cook', at: 23.5 },
        { cap: ['Sans compte : sur iPhone,', 'iPad et *iCloud*'], show: 'settings' },
      ];
      // The app's iPad sidebar ((tabs)/_layout.tsx): brand, Add, the tabs, Profile at the bottom.
      function sidebar(on) {
        let side = $('#side');
        if (!side) {
          side = document.createElement('div');
          side.id = 'side';
          screen.appendChild(side);
        }
        const tab = { home: 'home', search: 'search', planning: 'plan', shopping: 'shop' }[on];
        const it = (k, icon, label) =>
          `<div class="it ${tab === k ? 'on' : ''}">${icon}<span>${tr(label)}</span></div>`;
        side.innerHTML = `<div class="brand"><img src="${ICON}" style="width:36px;height:36px;border-radius:9px">PepperedApron</div>
  <div class="add">${I.plus(22)}<span>${tr('Ajouter une recette')}</span></div>
  <div style="display:flex;flex-direction:column;gap:2px">${it('home', I.homeO, 'Accueil')}${it('search', I.search, 'Recherche')}${it('fav', I.heart(), 'Favoris')}${it('plan', I.cal, 'Planning')}${it('shop', I.cart, 'Courses')}</div>
  <div style="flex:1"></div>${it('profile', I.person, 'Profil')}`;
      }
      function still(i) {
        const s = STILLS[i];
        if (s.at) seek(s.at);
        else seek(1.0);
        for (const k of Object.keys(layers)) {
          show(k, k === s.show ? 1 : 0);
          layers[k].style.transform = `scale(${IPAD ? 0.82 : screen.clientWidth / 390})`;
        }
        if (IPAD) {
          const full = s.show === 'reel' || s.show === 'cook';
          layers[s.show].classList.toggle('full', full);
          document.body.classList.toggle('noside', full);
          sidebar(s.show);
        }
        // Screens at rest: not scrolled.
        for (const el of document.querySelectorAll('.scr .in')) el.style.transform = '';
        if (s.show === 'reel') $('#sheet').style.transform = 'translateY(0)';
        $('#tap').style.opacity = '0';
        $('#cam').style.transform = '';
        css($('#phone'), { transform: 'none', opacity: '1' });
        $('#outro').style.opacity = '0';
        for (const c of CAPTIONS) c.box.style.display = 'none';
        let box = $('#stillCap');
        if (!box) {
          box = document.createElement('div');
          box.id = 'stillCap';
          box.style.cssText = 'position:absolute;left:0;right:0;top:0';
          capEl.appendChild(box);
        }
        box.innerHTML = s.cap
          .map(tr)
          .map(
            (l) =>
              `<div class="l">${l
                .split(' ')
                .map(
                  (w) => `<span class="${/\*/.test(w) ? 'hl' : ''}">${w.replace(/\*/g, '')}</span>`,
                )
                .join(' ')}</div>`,
          )
          .join('');
      }

      // ================================================================ entry points
      translateTree(document.getElementById('stage'));
      window.DURATION = DURATION;
      window.STILLS = STILLS.length;
      window.seek = seek;
      window.still = still;
      window.ready = Promise.all([
        document.fonts.ready,
        ...[...document.images].map((im) =>
          im.complete
            ? 0
            : new Promise((r) => {
                im.onload = im.onerror = r;
              }),
        ),
      ]).then(() => scaleScreen());
      if (Q.has('still')) window.ready.then(() => still(Number(Q.get('still'))));
      else if (!navigator.webdriver) {
        let t0 = null;
        const loop = (now) => {
          t0 ??= now;
          seek(((now - t0) / 1000) % DURATION);
          requestAnimationFrame(loop);
        };
        window.ready.then(() => requestAnimationFrame(loop));
      } else window.ready.then(() => seek(0));
    </script>
  </body>
</html>
