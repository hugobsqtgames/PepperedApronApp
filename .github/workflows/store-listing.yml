name: App Store listing

# Fills the App Store Connect page (texts, links, categories, screenshots in French and
# English) from docs/store/listings.json and the screenshots rendered by tools/brand.
# Never uploads a build and never submits for review: that stays a decision made by hand.
# Requires the repository secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (an App Store
# Connect API key with the App Manager role).
on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Version shown on the App Store page being edited
        default: 2.0.0
      screenshots:
        description: Replace the screenshots too
        type: boolean
        default: true

jobs:
  listing:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Render the screenshots
        if: ${{ inputs.screenshots }}
        working-directory: tools/brand
        env:
          CHROMIUM_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: |
          node preview/render.mjs stills
          node preview/render.mjs stills --en
          node preview/render.mjs stills-ipad
          node preview/render.mjs stills-ipad --en
      - name: Prepare the listing
        run: node tools/store/prepare.mjs fastlane ${{ !inputs.screenshots && '--texts-only' || '' }}
      - name: App Store Connect API key
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          node -e '
            const fs = require("fs");
            fs.writeFileSync(process.env.RUNNER_TEMP + "/asc.json", JSON.stringify({
              key_id: process.env.KEY_ID, issuer_id: process.env.ISSUER_ID,
              key: process.env.KEY_P8, in_house: false }));'
      - name: Upload to App Store Connect
        run: |
          brew install fastlane >/dev/null || gem install fastlane --no-document
          fastlane deliver \
            --api_key_path "$RUNNER_TEMP/asc.json" \
            --app_identifier app.pepperedapron.com \
            --app_version "${{ inputs.app_version }}" \
            --platform ios \
            --metadata_path fastlane/metadata \
            --screenshots_path fastlane/screenshots \
            --skip_binary_upload true \
            --skip_screenshots ${{ !inputs.screenshots }} \
            --overwrite_screenshots ${{ inputs.screenshots }} \
            --submit_for_review false \
            --automatic_release false \
            --run_precheck_before_submit false \
            --force true
      - name: Forget the key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc.json"
