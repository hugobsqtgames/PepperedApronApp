name: Mobile build & submit

# Cloud builds with EAS. Requires the EXPO_TOKEN repository secret; the other build secrets
# (Apple team, EAS project…) live in EAS environment variables, not in GitHub.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [staging, production]
        default: staging
      submit:
        description: Submit to TestFlight (production only)
        type: boolean
        default: false
      watch:
        description: Include the Apple Watch app (its signing profile must exist, created once by an interactive build)
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build
        env:
          # Read when the app config is evaluated here (credentials) and on EAS (the profile).
          APPLE_WATCH: ${{ inputs.watch && '1' || '0' }}
        run: >-
          eas build --non-interactive --no-wait
          --profile ${{ inputs.profile }}${{ !inputs.watch && inputs.profile == 'production' && '-nowatch' || '' }} --platform ios
          ${{ inputs.submit && inputs.profile == 'production' && '--auto-submit' || '' }}
