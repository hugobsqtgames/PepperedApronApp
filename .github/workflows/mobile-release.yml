name: Mobile build & submit

# Cloud builds with EAS. Requires the EXPO_TOKEN repository secret; the other build secrets
# (Apple team, EAS project…) live in EAS environment variables, not in GitHub.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        type: choice
        options: [staging, production]
        default: staging
      submit:
        description: Submit to TestFlight (production only)
        type: boolean
        default: false
      submit_latest_only:
        description: Do not build; send the latest finished production build to TestFlight
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Send the latest build to TestFlight
        if: ${{ inputs.submit_latest_only }}
        # The app config picks the bundle id from APP_VARIANT (development by default).
        env:
          APP_VARIANT: production
        run: eas submit --non-interactive --platform ios --profile production --latest --no-wait
      - name: Build
        if: ${{ !inputs.submit_latest_only }}
        run: >-
          eas build --non-interactive --no-wait
          --profile ${{ inputs.profile }} --platform ios
          ${{ inputs.submit && inputs.profile == 'production' && '--auto-submit' || '' }}
