name: Website

# Static pages required by the stores (privacy policy, support URL), published with GitHub Pages.
# Repository variables: LEGAL_PUBLISHER, LEGAL_ADDRESS, LEGAL_HOSTING, SUPPORT_EMAIL, SITE_DOMAIN.
on:
  push:
    branches: [main]
    paths: ['apps/site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: apps/site
        env:
          LEGAL_PUBLISHER: ${{ vars.LEGAL_PUBLISHER }}
          LEGAL_ADDRESS: ${{ vars.LEGAL_ADDRESS }}
          LEGAL_HOSTING: ${{ vars.LEGAL_HOSTING }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
        run: node src/build.mjs --out dist --production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
