name: Website

# Static pages required by the stores (privacy policy, support URL), published with GitHub Pages
# at https://<owner>.github.io/<repo>/ (or at SITE_DOMAIN when one is set).
# Optional repository variables: LEGAL_PUBLISHER (default "PepperedApron"), LEGAL_ADDRESS,
# LEGAL_HOSTING (default GitHub), SUPPORT_EMAIL (else the repository's issues page), SITE_DOMAIN.
on:
  push:
    branches: [main, claude/pepperedapron-mobile-app-5vzcqv]
    paths: ['apps/site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        working-directory: apps/site
        env:
          LEGAL_PUBLISHER: ${{ vars.LEGAL_PUBLISHER || 'PepperedApron' }}
          LEGAL_ADDRESS: ${{ vars.LEGAL_ADDRESS }}
          LEGAL_HOSTING: ${{ vars.LEGAL_HOSTING }}
          SUPPORT_EMAIL: ${{ vars.SUPPORT_EMAIL }}
          SUPPORT_URL: ${{ format('https://github.com/{0}/issues', github.repository) }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
          # Without a domain of its own the site lives under /<repo>/.
          SITE_BASE: ${{ vars.SITE_DOMAIN == '' && format('/{0}', github.event.repository.name) || '' }}
        run: node src/build.mjs --out dist --production
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/site/dist
      - id: deployment
        uses: actions/deploy-pages@v4
